# Cada push a develop publica una versión de Slate para Windows en GitHub Releases. Las copias
# instaladas la encuentran en Ajustes › Actualizaciones.
name: Publicar versión

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write # crear la release y subir el instalador

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Cada publicación sube el número: 0.2.<ejecución>. Solo cambia en la CI, no en el repo.
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # No se publica nada que no pase el lint y las pruebas de lógica.
      - run: npm run lint
      - run: npm run check

      - run: npm version "$VERSION" --no-git-tag-version

      - run: npm run build

      # electron-builder solo compila: deja en dist/ el instalador, su blockmap y latest.yml.
      - run: npx electron-builder --win --publish never

      # Prueba el binario que se usó para crear el instalador, antes de publicarlo.
      - name: Probar el ejecutable empaquetado
        run: npm run look:exe

      - name: Probar el historial ANSI al alternar Cambios
        run: npm run look:scroll -- --exe dist/win-unpacked/slate.exe

      - name: Guardar capturas del recorrido
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: slate-capturas-windows
          path: |
            .look/*.png
            .look/scroll/verificado/*.png
          include-hidden-files: true

      # La release se crea de una vez con los tres archivos: sin latest.yml, las copias
      # instaladas no verían la versión.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            "dist/slate-$VERSION-setup.exe" \
            "dist/slate-$VERSION-setup.exe.blockmap" \
            dist/latest.yml \
            --target "$GITHUB_SHA" \
            --title "Slate $VERSION" \
            --notes "Versión publicada desde develop ($GITHUB_SHA)."
