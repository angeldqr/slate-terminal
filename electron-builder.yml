appId: com.slate.terminal
productName: Slate
directories:
  buildResources: build
files:
  - 'out/**/*'
  - 'resources/**/*'
  - 'THIRD_PARTY_NOTICES.md'
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
win:
  executableName: slate
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  include: build/installer.nsh
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Ángel Quintero
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# De aquí lee electron-updater las versiones nuevas (Ajustes › Actualizaciones). La CI publica
# una con cada push a develop; los builds locales no publican nada.
publish:
  provider: github
  owner: angeldqr
  repo: slate-terminal
  releaseType: release
