appId: com.slate.terminal
productName: Slate
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
win:
  executableName: slate
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Ángel Quintero
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# De aquí lee electron-updater las versiones nuevas (Ajustes › Actualizaciones). La CI publica
# una con cada push a develop; los builds locales no publican nada.
publish:
  provider: github
  owner: angeldqr
  repo: slate-terminal
  releaseType: release
